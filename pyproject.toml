[project]
name = "odometry"
version = "0.1.0"
description = ""
authors = [{ name = "David Hunt", email = "dmh89@duke.edu" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10, <3.13"
dependencies = [
    "numpy>=1.25,<2.0.0",
    "scikit-learn>=1.3.2,<2.0.0",
    "SciPy>=1.11.4,<2.0.0",
    "matplotlib>=3.8.2,<4.0.0",
    "tqdm>=4.66.1,<5.0.0",
    "ipywidgets>=8.1.1,<9.0.0",
    "jupyter>=1.0.0,<2.0.0",
    "pytest>=7.4.4,<8.0.0",
    "imageio[ffmpeg]>=2.33.1,<3.0.0",
    "addict>=2.4.0,<3.0.0",
    "pandas>=2.1.4,<3.0.0",
    "opencv-python>4.7,<4.9.0.80",
    "poetry-dotenv-plugin>=0.2.0,<0.3.0",
    "optuna[visualization] (>=4.6.0,<5.0.0)",
    "optuna-dashboard (>=0.20.0,<0.21.0)",
]

[tool.poetry]
packages = [{ include = "odometry" }]

[tool.poetry.group.submodules]
optional = true

[tool.poetry.group.submodules.dependencies]
cpsl_datasets = { path = "./submodules/cpsl_datasets/", develop = true }
mmwave_radar_processing = { path = "./submodules/mmwave_radar_processing/", develop = true }
mmwave_model_integrator = { path = "./submodules/mmwave_model_integrator/", develop = true }
radcloud = { path = "./submodules/radcloud/", develop = true }
radarhd = { path = "./submodules/radarhd/", develop = true }
lib-avstack-core = { path = "./submodules/lib-avstack-core/", develop = true }
geometries = { path = "./submodules/geometries/", develop = true }

[tool.poetry.group.torch.dependencies]
torch = "^2.4.0"
torchvision = "^0.19.0"
torchaudio = "^2.4.0"
torchsummary = "^1.5.1"
torch-geometric = "^2.6.1"

[tool.poetry.group.dev.dependencies]
ipywidgets = "^8.1.1"
jupyter = "^1.0.0"

[tool.poetry.group.test.dependencies]
pytest = "^7.4.4"
bandit = "^1.7"
black = "~22.12.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
